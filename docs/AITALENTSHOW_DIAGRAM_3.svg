ages</text><text x="501" y="107" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">MessageKey / LastRunId</text><rect x="834" y="30" width="222" height="100" rx="6" fill="#fff5e6" stroke="#b9c9d4"/><text x="945" y="57" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#20354a">评分版本</text><text x="945" y="83" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20354a">MessageKey + 内容哈希</text><text x="945" y="107" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">模型版本 + 评估版本</text><rect x="834" y="210" width="222" height="100" rx="6" fill="#fff5e6" stroke="#b9c9d4"/><text x="945" y="237" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#20354a">复核记录</text><text x="945" y="263" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20354a">Reviewer / ReviewAt</text><text x="945" y="287" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">原因 + 状态</text><rect x="390" y="210" width="222" height="100" rx="6" fill="#fff5e6" stroke="#b9c9d4"/><text x="501" y="237" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#20354a">最终积分版本</text><text x="501" y="263" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20354a">MessageKey | Eval | Rule</text><text x="501" y="287" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">一个消息一个当前有效版本</text><rect x="24" y="210" width="222" height="100" rx="6" fill="#fff5e6" stroke="#b9c9d4"/><text x="135" y="237" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" f