<svg viewBox="0 0 1080 520" role="img" aria-label="训练、组外验证与日常推理的不同路径" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#51677d"/></marker></defs><path d="M246 80H383" fill="none" stroke="#51677d" stroke-width="2" marker-end="url(#arrow)"/><path d="M612 80H827" fill="none" stroke="#51677d" stroke-width="2" marker-end="url(#arrow)"/><path d="M135 130V260H383" fill="none" stroke="#51677d" stroke-width="2" marker-end="url(#arrow)"/><path d="M501 310V383" fill="none" stroke="#51677d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M246 440H383" fill="none" stroke="#51677d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M612 440H827" fill="none" stroke="#51677d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="24" y="30" width="222" height="100" rx="6" fill="#edf4f8" stroke="#b9c9d4"/><text x="135" y="57" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#20354a">有标签正文</text><text x="135" y="83" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20354a">CSV + 人工 / 弱标签</text><text x="135" y="107" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">按线程及重复正文分组</text><rect x="390" y="30" width="222" height="100" rx="6" fill="#edf4f8" stroke="#b9c9d4"/><text x="501" y="57" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#20354a">每折独立训练</text><text x="501" y="83" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20354a">TF-IDF + Ridge</text><text x="501" y="107" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">词表与IDF只看训练折</text><rect x="834" y="30" width="222" height="100" rx="6" fill="#edf4f8" stroke="#b9c9d4"/><text x="945" y="57" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#20354a">组外评估</text><text x="945" y="83" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20354a">OutOfFoldScore</text><text x="945" y="107" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">MAE 0.937 / 基线 0.980</text><rect x="390" y="210" width="222" height="100" rx="6" fill="#edf4f8" stroke="#b9c9d4"/><text x="501" y="237" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#20354a">全量拟合</text><text x="501" y="263" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20354a">冻结模型 model.joblib</text><text x="501" y="287" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">FittedScore 是回代结果</text><rect x="24" y="390" width="222" height="100" rx="6" fill="#fff5e6" stroke="#b9c9d4"/><text x="135" y="417" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#20354a">新增或修改的消息</text><text x="135" y="443" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20354a">ContentText + 业务键</text><text x="135" y="467" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">无需预先有人工作分</text><rect x="390" y="390" width="222" height="100" rx="6" fill="#fff5e6" stroke="#b9c9d4"/><text x="501" y="417" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#20354a">加载模型只预测</text><text x="501" y="443" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20354a">CandidateScore + 版本</text><text x="501" y="467" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">独立推理入口待补</text><rect x="834" y="390" width="222" height="100" rx="6" fill="#fff5e6" stroke="#b9c9d4"/><text x="945" y="417" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#20354a">人工复核与发布</text><text x="945" y="443" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20354a">FinalPoints</text><text x="945" y="467" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#20354a">业务规则在此执行</text></svg>